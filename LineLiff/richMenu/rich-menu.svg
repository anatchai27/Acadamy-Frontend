<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686" role="img" aria-labelledby="title desc">
  <title id="title">tiwhub — Parent Rich Menu</title>
  <desc id="desc">Rich Menu for parents: Home, Attendance, Tuition, Leave and makeup, Homework, and Scores.</desc>
  <defs>
