<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1540" viewBox="0 0 1500 1540" role="img" aria-labelledby="title desc">
  <title id="title">tiwhub Minimal Mascots — 9 concept directions</title>
  <desc id="desc">A contact sheet of nine minimal animal and school-supply mascot ideas for tiwhub.</desc>
  <rect width="1500" height="1540" fill="#F4F8FC"/>
  <text x="68" y="77" fill="#17335C" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif" font-size="42" font-weight="700">tiwhub · มาสคอตมินิมอล</text>
  <text x="70" y="116" fill="#52657D" font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif" font-size="20">9 แนวคิดสัตว์และอุปกรณ์การเรียน ในชุดสี Oasis Blue · Cyan · Learning Navy</text>
  <g font-family="Sarabun, 'Leelawadee UI', Tahoma, sans-serif" text-anchor="middle">
    <g transform="translate(60 158)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="01-owl.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">01 · นกฮูก</text><text x="220" y="357" fill="#52657D" font-size="18">สัตว์ · ช่างสังเกตและรักการเรียนรู้</text></g>
    <g transform="translate(530 158)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="02-cat.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">02 · แมว</text><text x="220" y="357" fill="#52657D" font-size="18">สัตว์ · เพื่อนเรียนที่เป็นมิตร</text></g>
    <g transform="translate(1000 158)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="03-book.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">03 · หนังสือ</text><text x="220" y="357" fill="#52657D" font-size="18">อุปกรณ์ · สัญลักษณ์แห่งการเรียน</text></g>

    <g transform="translate(60 602)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="04-pencil.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">04 · ดินสอ</text><text x="220" y="357" fill="#52657D" font-size="18">อุปกรณ์ · เริ่มต้นลงมือสร้างทักษะ</text></g>
    <g transform="translate(530 602)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="05-fox.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">05 · จิ้งจอก</text><text x="220" y="357" fill="#52657D" font-size="18">สัตว์ · ฉลาด ช่างคิด และอยากรู้อยากเห็น</text></g>
    <g transform="translate(1000 602)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="06-turtle.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">06 · เต่า</text><text x="220" y="357" fill="#52657D" font-size="18">สัตว์ · ค่อย ๆ เรียนรู้และเติบโต</text></g>

    <g transform="translate(60 1046)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="07-backpack.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">07 · กระเป๋านักเรียน</text><text x="220" y="357" fill="#52657D" font-size="18">อุปกรณ์ · พร้อมพกพาความรู้ไปด้วยกัน</text></g>
    <g transform="translate(530 1046)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="08-globe.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">08 · ลูกโลก</text><text x="220" y="357" fill="#52657D" font-size="18">อุปกรณ์ · เปิดมุมมองสู่โลกกว้าง</text></g>
    <g transform="translate(1000 1046)"><rect width="440" height="420" rx="28" fill="#FFFFFF" stroke="#D8E4F1" stroke-width="2"/><image href="09-calculator.png" x="95" y="18" width="250" height="250"/><text x="220" y="323" fill="#17335C" font-size="27" font-weight="700">09 · เครื่องคิดเลข</text><text x="220" y="357" fill="#52657D" font-size="18">อุปกรณ์ · คิดเป็น แก้โจทย์ได้</text></g>
