name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore API and tests
        run: dotnet restore API/academy-API.Tests/academy-API.Tests.csproj
      - name: Build API
        run: dotnet build API/academy-API.csproj --no-restore --configuration Release
      - name: Run API tests
        run: dotnet test API/academy-API.Tests/academy-API.Tests.csproj --no-restore --configuration Release --logger "trx;LogFileName=api-tests.trx"

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Front tests
        run: npm test -- --run
      - name: Build Front
        run: npm run build

  line-liff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LineLiff
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LineLiff/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build LINE LIFF
        run: npm run build
