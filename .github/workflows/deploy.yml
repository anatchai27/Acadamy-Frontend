name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build .NET API
        run: |
          dotnet publish API/academy-API.csproj -c Release -o publish/api --self-contained false

      - name: Prepare Backend target on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo systemctl stop my-api.service || true
            sudo mkdir -p /var/www/my-api
            sudo find /var/www/my-api -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Deploy Backend binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "publish/api/*"
          target: "/var/www/my-api"
          strip_components: 2

      - name: Fix permissions and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backend: service runs as www-data in this project.
            sudo chown -R www-data:www-data /var/www/my-api
            sudo find /var/www/my-api -type d -exec chmod 755 {} \;
            sudo find /var/www/my-api -type f -exec chmod 644 {} \;

            sudo systemctl start my-api.service